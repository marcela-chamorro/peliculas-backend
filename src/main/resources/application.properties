# ===============================
# Configuracion de aplicacion
# ===============================
server.port=8080
spring.application.name=pelicula-service

# ===============================
# Configuracion de Base de Datos
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/peliculas_db
spring.datasource.username=user_peliculas
spring.datasource.password=pass_peliculas
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Keycloak OAuth2 Security
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/cinecloud
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/cinecloud/protocol/openid-connect/certs

# ===============================
# Swagger/OpenAPI Configuration
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.oauth.client-id=peliculas-app
springdoc.swagger-ui.oauth.use-pkce=true

# ===============================
# CORS Configuration
# ===============================
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
