# ===============================
# Configuracion de aplicacion
# ===============================
server.port=8080
spring.application.name=pelicula-service

# ===============================
# Configuracion de Base de Datos
# ===============================
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/peliculas_db}
spring.datasource.username=user_peliculas
spring.datasource.password=pass_peliculas
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Keycloak OAuth2 Security
# ===============================
# Valida el 'iss' contra la URL pública/externa
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/cinecloud}
# Busca los certs en la URL interna de Docker
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:9090/realms/cinecloud/protocol/openid-connect/certs}

# ===============================
# Swagger/OpenAPI Configuration para OAuth2
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.oauth.client-id=peliculas-app
springdoc.swagger-ui.oauth.client-secret=  # Si tu cliente no es público, agrega el secret aquí
springdoc.swagger-ui.oauth.use-pkce=false  # Desactiva PKCE para el flujo password
springdoc.swagger-ui.oauth.scopes=openid,profile
springdoc.swagger-ui.oauth.realm=cinecloud

# ===============================
# CORS Configuration
# ===============================
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
