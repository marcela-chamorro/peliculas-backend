services:
  peliculas-app:
    build: .
    container_name: peliculas-app-container
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://peliculas-db:5432/peliculas_db
      SPRING_DATASOURCE_USERNAME: user_peliculas
      SPRING_DATASOURCE_PASSWORD: pass_peliculas
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/cinecloud
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/cinecloud/protocol/openid-connect/certs
    depends_on:
      - peliculas-db
      - keycloak
    networks:
      - peliculas-network

  peliculas-db:
    image: postgres:13-alpine
    container_name: peliculas-db-container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: peliculas_db
      POSTGRES_USER: user_peliculas
      POSTGRES_PASSWORD: pass_peliculas
    volumes:
      - peliculas-data:/var/lib/postgresql/data
    networks:
      - peliculas-network

  keycloak-db:
    image: postgres:13-alpine
    container_name: keycloak-db-container
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pass
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    networks:
      - peliculas-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak-container
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass
      KC_HTTP_ENABLED: "true"
    command:
      - start-dev
    ports:
      - "9090:8080"
    depends_on:
      - keycloak-db
    networks:
      - peliculas-network

volumes:
  peliculas-data:
  keycloak-data:

networks:
  peliculas-network:
    driver: bridge
